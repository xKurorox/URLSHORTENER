# event trigger when pushing to main branch
on:
  push:
    branches:
      - main

jobs:
  run-test:
    name: run-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      
      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Test
        run: pytest
